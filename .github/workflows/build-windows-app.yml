name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App to build (must match an entry in scripts/app_registry.py)
        type: choice
        default: Wordle by Chinmay Mokashi
        options:
          - Wordle by Chinmay Mokashi
          - Sudoku by Chinmay Mokashi

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Resolve app from registry
        id: app
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from scripts.app_registry import resolve_app_spec
          spec = resolve_app_spec(os.environ["REQUESTED_APP"])
          print("display_name=" + spec["display_name"])
          print("entry_script=" + spec["entry_script"])
          print("asset_dir=" + spec["asset_dir"])
          print("slug=" + re.sub(r"[^a-z0-9]+", "-", spec["display_name"].lower()).strip("-"))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build app with PyInstaller
        shell: pwsh
        env:
          APP_NAME: ${{ steps.app.outputs.display_name }}
          ENTRY_SCRIPT: ${{ steps.app.outputs.entry_script }}
          ASSET_DIR: ${{ steps.app.outputs.asset_dir }}
        run: |
          $iconArg = @()
          if (Test-Path "$env:ASSET_DIR/logo.ico") {
            $iconArg = @("--icon", "$env:ASSET_DIR/logo.ico")
          }

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "$env:APP_NAME" `
            --add-data "$env:ASSET_DIR;$env:ASSET_DIR" `
            @iconArg `
            "$env:ENTRY_SCRIPT"

      - name: Zip app bundle
        shell: pwsh
        env:
          APP_NAME: ${{ steps.app.outputs.display_name }}
        run: |
          Compress-Archive -Path "dist/$env:APP_NAME/*" -DestinationPath "dist/$env:APP_NAME-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.slug }}-windows
          path: dist/${{ steps.app.outputs.display_name }}-windows.zip
