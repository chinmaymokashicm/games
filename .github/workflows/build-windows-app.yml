name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_NAME: Wordle by Chinmay Mokashi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build app with PyInstaller
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/wordle/logo.ico") {
            $iconArg = @("--icon", "assets/wordle/logo.ico")
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "$env:APP_NAME" `
            --add-data "assets/wordle;assets/wordle" `
            @iconArg `
            wordle_ui.py

      - name: Zip app bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:APP_NAME/*" -DestinationPath "dist/$env:APP_NAME-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordle-by-chinmay-mokashi-windows
          path: dist/Wordle by Chinmay Mokashi-windows.zip
