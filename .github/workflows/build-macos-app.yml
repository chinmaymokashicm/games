name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App to build (must match an entry in scripts/app_registry.py)
        type: choice
        default: Wordle by Chinmay Mokashi
        options:
          - Wordle by Chinmay Mokashi
          - Sudoku by Chinmay Mokashi

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      APP_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Resolve app from registry
        id: app
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from scripts.app_registry import resolve_app_spec
          spec = resolve_app_spec(os.environ["REQUESTED_APP"])
          print("display_name=" + spec["display_name"])
          print("entry_script=" + spec["entry_script"])
          print("asset_dir=" + spec["asset_dir"])
          print("slug=" + re.sub(r"[^a-z0-9]+", "-", spec["display_name"].lower()).strip("-"))
          PY
          python -c 'import os; from scripts.app_registry import resolve_app_spec as r; print("APP_NAME=" + r(os.environ["REQUESTED_APP"])["display_name"])' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build icon file
        shell: bash
        env:
          ASSET_DIR: ${{ steps.app.outputs.asset_dir }}
          ENTRY_SCRIPT: ${{ steps.app.outputs.entry_script }}
        run: |
          if [[ -f "$ASSET_DIR/logo.png" ]]; then
            mkdir -p build/icon.iconset
            sips -z 16 16     $ASSET_DIR/logo.png --out build/icon.iconset/icon_16x16.png >/dev/null
            sips -z 32 32     $ASSET_DIR/logo.png --out build/icon.iconset/icon_16x16@2x.png >/dev/null
            sips -z 32 32     $ASSET_DIR/logo.png --out build/icon.iconset/icon_32x32.png >/dev/null
            sips -z 64 64     $ASSET_DIR/logo.png --out build/icon.iconset/icon_32x32@2x.png >/dev/null
            sips -z 128 128   $ASSET_DIR/logo.png --out build/icon.iconset/icon_128x128.png >/dev/null
            sips -z 256 256   $ASSET_DIR/logo.png --out build/icon.iconset/icon_128x128@2x.png >/dev/null
            sips -z 256 256   $ASSET_DIR/logo.png --out build/icon.iconset/icon_256x256.png >/dev/null
            sips -z 512 512   $ASSET_DIR/logo.png --out build/icon.iconset/icon_256x256@2x.png >/dev/null
            sips -z 512 512   $ASSET_DIR/logo.png --out build/icon.iconset/icon_512x512.png >/dev/null
            sips -z 1024 1024 $ASSET_DIR/logo.png --out build/icon.iconset/icon_512x512@2x.png >/dev/null
            iconutil -c icns build/icon.iconset -o $ASSET_DIR/logo.icns
          fi

      - name: Build app with PyInstaller
        shell: bash
        env:
          ASSET_DIR: ${{ steps.app.outputs.asset_dir }}
          ENTRY_SCRIPT: ${{ steps.app.outputs.entry_script }}
        run: |
          if [[ -f "$ASSET_DIR/logo.icns" ]]; then
            ICON_ARG="--icon $ASSET_DIR/logo.icns"
          else
            ICON_ARG=""
          fi

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "$APP_NAME" \
            --target-architecture "$APP_ARCH" \
            --add-data "$ASSET_DIR:$ASSET_DIR" \
            $ICON_ARG \
            "$ENTRY_SCRIPT"

      - name: Detect signing configuration
        id: detect_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_DEVELOPER_ID_APPLICATION; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization disabled. Building unsigned artifact."
          fi

      - name: Import Developer ID certificate
        if: ${{ steps.detect_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${{ github.run_id }}-${{ github.run_attempt }}"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Code sign app bundle
        if: ${{ steps.detect_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="dist/$APP_NAME.app"
          codesign \
            --deep \
            --force \
            --verify \
            --verbose \
            --options runtime \
            --sign "$APPLE_DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        if: ${{ steps.detect_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="dist/$APP_NAME.app"
          ZIP_PATH="dist/$APP_NAME-macOS-$APP_ARCH.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Zip app bundle
        if: ${{ steps.detect_signing.outputs.enabled != 'true' }}
        shell: bash
        run: |
          APP_PATH="dist/$APP_NAME.app"
          ZIP_PATH="dist/$APP_NAME-macOS-$APP_ARCH.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Cleanup temporary signing keychain
        if: ${{ always() && steps.detect_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.slug }}-macos-${{ matrix.arch }}
          path: dist/${{ steps.app.outputs.display_name }}-macOS-${{ matrix.arch }}.zip
